name: CLI checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' mypy flake8 build
      - run: python -m flake8 maxcli tests --select=E9,F63,F7,F82 --show-source
      - run: python -m mypy maxcli
      - run: python -m pytest -o addopts= -q --cov=maxcli --cov-report=xml
      - run: python -m build --wheel
