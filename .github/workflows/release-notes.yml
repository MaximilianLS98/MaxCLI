name: Release notes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Release notes / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Require a new entry on every PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/release_notes.py check --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate main entries
        if: github.event_name == 'push'
        run: python scripts/release_notes.py check --head HEAD
