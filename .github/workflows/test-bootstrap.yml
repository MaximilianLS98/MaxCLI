name: Install lifecycle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  installation:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: bash test_bootstrap.sh -q
        env:
          MAXCLI_RUN_INSTALL_TESTS: '1'
