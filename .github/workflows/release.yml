name: GitHub release

on:
  push:
    tags: ['v[0-9]*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH or prerelease)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      # Always use tooling from the release's own commit, including on manual reruns.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Assemble release notes
        run: >-
          python scripts/release_notes.py render
          --ref "refs/tags/$RELEASE_TAG" --version "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/release-notes.md"
      - name: Retain generated notes for inspection
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
      - name: Create release or refresh generated section
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_notes.py publish
          --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --notes "$RUNNER_TEMP/release-notes.md"
